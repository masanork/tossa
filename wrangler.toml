# wrangler.toml: Cloudflare Workers configuration for tossa
name = "tossa"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Static Assets (Svelte 5 Single Page Application)
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/mcp",
  "/mcp/*",
  "/ogp/*",
  "/sitemap.xml",
  "/robots.txt",
  "/llms.txt",
  "/llms-full.txt",
  "/feed.xml",
  "/posts/*",
]

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tossa-db"
database_id = "5c2c9eea-b0f2-428c-843f-fbd5e2ecf0d0"

# Public feed snapshot (Workers Paid KV allotment — no extra product)
[[kv_namespaces]]
binding = "FEED_KV"
id = "f22ffac4a48c4c2eb9bc117711e724dd"

# Future: Postgres via Hyperdrive when a single D1 is no longer enough.
# Uncomment and fill in after `wrangler hyperdrive create ...` (this *does* add cost).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = ""

# tossa.app is attached as a Workers Custom Domain in the dashboard
# (account /workers/domains). Do not add [[routes]] here: wrangler 4 GETs
# /zones/:id/workers/routes as a conflict check for every route, including
# custom_domain, and the deploy token has no Zone Workers Routes permission.

# Environment Variables
[vars]
RP_NAME = "tossa"
RP_ID = "tossa.app"
EXPECTED_ORIGIN = "https://tossa.app"

# Cloudflare R2 Storage (High-Traffic Media & Image Storage)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "tossa-images"

# Cloudflare Queues (Asynchronous Web Push & High-Traffic Buffering)
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "tossa-push-queue"

[[queues.consumers]]
queue = "tossa-push-queue"
max_batch_size = 25
max_batch_timeout = 5

# Cloudflare Queues (Write Buffer / Smoothing for High-Traffic Spikes)
[[queues.producers]]
binding = "WRITE_QUEUE"
queue = "tossa-write-queue"

[[queues.consumers]]
queue = "tossa-write-queue"
max_batch_size = 50
max_batch_timeout = 5

# Cron Triggers (Automated Daily D1 Database Backup & R2 Archival)
[triggers]
crons = ["0 3 * * *"] # Daily at 12:00 JST (03:00 UTC)

# Transactional email (onboard tossa.app in Email Sending first)
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@tossa.app"]


