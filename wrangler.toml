# wrangler.toml: Cloudflare Workers configuration for tossa
name = "tossa"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Static Assets (Svelte 5 Single Page Application)
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tossa-db"
database_id = "5c2c9eea-b0f2-428c-843f-fbd5e2ecf0d0"

# Environment Variables
[vars]
RP_NAME = "tossa"
RP_ID = "tossa.sorane.dev"
EXPECTED_ORIGIN = "https://tossa.sorane.dev"
