# wrangler.toml: Cloudflare Workers configuration for tossa
name = "tossa"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Static Assets (Svelte 5 Single Page Application)
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/mcp",
  "/mcp/*",
  "/ogp/*",
  "/sitemap.xml",
  "/robots.txt",
  "/llms.txt",
  "/llms-full.txt",
  "/feed.xml",
  "/posts/*",
]

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tossa-db"
database_id = "5c2c9eea-b0f2-428c-843f-fbd5e2ecf0d0"

# Public feed snapshot (usage and cost depend on the account's KV allotment)
[[kv_namespaces]]
binding = "FEED_KV"
id = "f22ffac4a48c4c2eb9bc117711e724dd"

# Future: Postgres via Hyperdrive when a single D1 is no longer enough.
# Uncomment after workload measurements justify it and usage/cost are reviewed.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = ""

# tossa.app is attached as a Workers Custom Domain in the dashboard
# (account /workers/domains). Do not add [[routes]] here: wrangler 4 GETs
# /zones/:id/workers/routes as a conflict check for every route, including
# custom_domain, and the deploy token has no Zone Workers Routes permission.

# Environment Variables
[vars]
RP_NAME = "tossa"
RP_ID = "tossa.app"
EXPECTED_ORIGIN = "https://tossa.app"

# Cloudflare R2 Storage (High-Traffic Media & Image Storage)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "tossa-images"

# Private backup archive: never enable public access or a custom domain.
[[r2_buckets]]
binding = "BACKUPS_BUCKET"
bucket_name = "tossa-backups"

# Cloudflare Queues (Asynchronous Web Push & High-Traffic Buffering)
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "tossa-push-queue"

[[queues.consumers]]
queue = "tossa-push-queue"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "tossa-push-deadletter"

# Cloudflare Queues (Write Buffer / Smoothing for High-Traffic Spikes)
[[queues.producers]]
binding = "WRITE_QUEUE"
queue = "tossa-write-queue"

[[queues.consumers]]
queue = "tossa-write-queue"
max_batch_size = 50
max_batch_timeout = 5
max_concurrency = 1
max_retries = 5
dead_letter_queue = "tossa-write-deadletter"

# Cron Triggers (Automated Daily D1 Database Backup & R2 Archival)
[triggers]
crons = ["* * * * *", "*/10 * * * *", "0 3 * * *"] # Feed + maintenance + daily backup

[observability]
enabled = true
head_sampling_rate = 0.1

# Transactional email (onboard tossa.app in Email Sending first)
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@tossa.app"]

# Best-effort counters shared within each Cloudflare location, not global quotas.

[[ratelimits]]
name = "POST_CREATE_LIMITER"
namespace_id = "714901001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "POST_UPDATE_LIMITER"
namespace_id = "714901002"
simple = { limit = 45, period = 60 }

[[ratelimits]]
name = "THREAD_CREATE_LIMITER"
namespace_id = "714901003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "THREAD_UPDATE_LIMITER"
namespace_id = "714901004"
simple = { limit = 45, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "714901005"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "FEDERATION_LIMITER"
namespace_id = "714901006"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "714901007"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "WRITE_IP_LIMITER"
namespace_id = "714901008"
simple = { limit = 6000, period = 60 }

[[ratelimits]]
name = "OTHER_WRITE_LIMITER"
namespace_id = "714901009"
simple = { limit = 60, period = 60 }

[observability.traces]
enabled = true
head_sampling_rate = 0.01
