# wrangler.toml: Cloudflare Workers configuration for tossa
name = "tossa"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Static Assets (Svelte 5 Single Page Application)
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tossa-db"
database_id = "5c2c9eea-b0f2-428c-843f-fbd5e2ecf0d0"

# Environment Variables
[vars]
RP_NAME = "tossa"
RP_ID = "tossa.sorane.dev"
EXPECTED_ORIGIN = "https://tossa.sorane.dev"

# Cloudflare R2 Storage (High-Traffic Media & Image Storage)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "tossa-images"

# Cloudflare Queues (Asynchronous Web Push & High-Traffic Buffering)
# Enable on Workers Paid plan to broadcast push notifications asynchronously to 10k+ subscribers without request timeout:
# [[queues.producers]]
# binding = "PUSH_QUEUE"
# queue = "tossa-push-queue"

# [[queues.consumers]]
# queue = "tossa-push-queue"
# max_batch_size = 25
# max_batch_timeout = 5

# Cloudflare Queues (Write Buffer / Smoothing for High-Traffic Spikes)
# Enable to absorb thousands of concurrent posts during disasters without D1 write timeouts:
# [[queues.producers]]
# binding = "WRITE_QUEUE"
# queue = "tossa-write-queue"

# [[queues.consumers]]
# queue = "tossa-write-queue"
# max_batch_size = 50
# max_batch_timeout = 5

# Cron Triggers (Automated Daily D1 Database Backup & R2 Archival)
[triggers]
crons = ["0 3 * * *"] # Daily at 12:00 JST (03:00 UTC)


