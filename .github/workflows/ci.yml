name: CI Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  test-and-lint:
    name: Lint, Typecheck, Knip, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Web Dependencies
        run: npm --prefix web ci

      - name: Compile Frontend & i18n Resources
        run: npm run build:web

      - name: Audit Production Dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix web audit --omit=dev --audit-level=high

      - name: Check Code Formatting & Tailwind Class Ordering (Prettier)
        run: npm run format:check

      - name: Lint Code (ESLint with Type-Checked Rules)
        run: npm run lint

      - name: Detect Dead Code & Unused Dependencies (Knip)
        run: npm run knip

      - name: Type Check (TypeScript & Svelte Check)
        run: npm run typecheck

      - name: Run Unit & Integration Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Run Local Backup and Recovery Drill
        timeout-minutes: 10
        run: npm run backup:drill

      - name: Verify Large SQL Export and Isolated Recovery
        timeout-minutes: 10
        run: npm run backup:export -- --local-drill --rows=30000

      - name: Check Local Capacity Workloads
        timeout-minutes: 3
        run: npm run load:local -- --sizes=5000 --requests=30 --concurrency=4 --output=/tmp/tossa-local-load.json

      - name: Preserve Local Capacity Measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-capacity-measurements
          path: /tmp/tossa-local-load.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Playwright Chromium, WebKit & System Dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Preserve Failed E2E Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Production Build
        run: npm run build

      - name: Update stats dashboard
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node --experimental-strip-types scripts/stats.ts --save stats
          node --experimental-strip-types scripts/plot-growth.ts --update --stats-file stats/stats.json
          npx prettier --write stats/stats.md
          git add stats/
          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore(stats): update codebase dashboard [skip ci]"
          git push

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://tossa.app
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Web Dependencies
        run: npm --prefix web ci

      - name: Compile Frontend & i18n Resources
        run: npm run build:web

      - name: Verify Required Production Schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute tossa-db --remote --command 'SELECT observed_at FROM posts LIMIT 0; SELECT id FROM mutation_receipts LIMIT 0; SELECT id FROM post_reports LIMIT 0;'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: '4.147.0'
          command: deploy

      - name: Smoke test production
        run: node scripts/smoke-production.mjs

  deploy-monitor:
    name: Deploy independent operations monitor
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-monitor-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy the monitor with its own bindings and Cron
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.147.0'
          command: deploy --config operations-monitor.wrangler.jsonc
      - name: Synchronize monitor secrets from the production environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATIONAL_ALERT_RECIPIENTS: ${{ secrets.OPERATIONAL_ALERT_RECIPIENTS }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const recipients = process.env.OPERATIONAL_ALERT_RECIPIENTS?.trim();
          if (!token || !recipients) throw Error('Monitor production secrets are missing');
          const emails = recipients.split(',').map(value => value.trim());
          if (emails.length > 50 || emails.some(value => value.length > 254 || !/^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/.test(value)))
            throw Error('Monitor recipient configuration is invalid');
          const result = spawnSync(process.execPath, [
            'node_modules/wrangler/bin/wrangler.js', 'secret', 'bulk',
            '--config', 'operations-monitor.wrangler.jsonc'
          ], {
            input: JSON.stringify({ MONITOR_QUEUE_API_TOKEN: token, OPERATIONAL_ALERT_RECIPIENTS: recipients }),
            stdio: ['pipe', 'ignore', 'ignore'], timeout: 120000
          });
          if (result.error || result.status !== 0) throw Error('Monitor secrets could not be synchronized');
          console.log(JSON.stringify({ monitorSecretsConfigured: true, recipients: emails.length }));
          NODE
