name: CI Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  test-and-lint:
    name: Lint, Typecheck, Knip, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Web Dependencies
        run: npm --prefix web ci

      - name: Compile Frontend & i18n Resources
        run: npm run build:web

      - name: Audit Production Dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix web audit --omit=dev --audit-level=high

      - name: Check Code Formatting & Tailwind Class Ordering (Prettier)
        run: npm run format:check

      - name: Lint Code (ESLint with Type-Checked Rules)
        run: npm run lint

      - name: Detect Dead Code & Unused Dependencies (Knip)
        run: npm run knip

      - name: Type Check (TypeScript & Svelte Check)
        run: npm run typecheck

      - name: Run Unit & Integration Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Initialize Local D1 Database Schema & Seed
        run: npm run db:reset:local

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Verify Production Build
        run: npm run build

      - name: Update stats dashboard
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node --experimental-strip-types scripts/stats.ts --save stats
          node --experimental-strip-types scripts/plot-growth.ts --update --stats-file stats/stats.json
          git add stats/
          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore(stats): update codebase dashboard [skip ci]"
          git push

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://tossa.app
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Web Dependencies
        run: npm --prefix web ci

      - name: Compile Frontend & i18n Resources
        run: npm run build:web

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: '3.114.17'
          command: deploy
