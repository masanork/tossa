name: External Operations Monitor

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-operations-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare private monitor directory
        run: install -d -m 700 "$RUNNER_TEMP/tossa-monitor"
      - name: Restore accepted incident state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/tossa-monitor/state.json
          key: tossa-monitor-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tossa-monitor-v1-
      - name: Check health, Queue lag and dead letters
        id: monitor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          OPERATIONAL_ALERT_RECIPIENTS: ${{ secrets.OPERATIONAL_ALERT_RECIPIENTS }}
          OPERATIONAL_ALERT_FROM: noreply@tossa.app
          OPERATIONAL_MONITOR_STATE_FILE: ${{ runner.temp }}/tossa-monitor/state.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import { monitorOperations } from './scripts/monitor-operations.mjs';
          const report = await monitorOperations();
          console.log(JSON.stringify(report));
          await appendFile(process.env.GITHUB_OUTPUT, `state_changed=${report.stateChanged === true}\n`);
          if (report.status === 'error' || report.status === 'alert') process.exitCode = 1;
          NODE
      - name: Save accepted incident state
        if: ${{ always() && steps.monitor.outputs.state_changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tossa-monitor/state.json
          key: tossa-monitor-v1-${{ github.run_id }}-${{ github.run_attempt }}
